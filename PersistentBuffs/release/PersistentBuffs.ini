; ============================================================
;  PersistentBuffs configuration
; ============================================================

[persistence]
; Re-apply buffs after a fast travel. 1=on, 0=off.
keep_after_fast_travel = 1

; Re-apply buffs after death/respawn. 1=on, 0=off.
keep_after_death = 1

; Keep Flask of Wondrous Physick tear effects through death/fast travel. 1=on, 0=off.
persist_physick_tears = 0

; If you find any effect being disabled after death or travelling, you can
; include it below and it will persist next time.
; A list of effects can be found here:
; https://github.com/soulsmods/Paramdex/blob/master/ER/Names/SpEffectParam.txt
; example: force_persist_ids = 1821, 1823, 1826, 1828
; above example is "Cragblade"
force_persist_ids =

; The opposite: effects you NEVER want re-applied, even though the mod
; tracks them (e.g. an overhaul effect that misbehaves). Beats every
; other rule. Same id list format as above.
never_persist_ids =

[weapon_memory]
; Remember which weapon-bound buffs (greases, blade spells) were on
; each weapon and re-apply them when you swap back to that weapon.
remember_per_weapon = 1

[session]
; save your active buffs to and restore them on the next game launch 
; for the same character. 1=on, 0=off.
remember_across_sessions = 1

[general]
debug_console = 0
log_effects = 1
log_untracked = 1

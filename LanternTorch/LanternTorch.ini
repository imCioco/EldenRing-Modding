; ============================================================
;  Lantern Torch - make the Lantern act like a torch.
;
;  The lantern keeps working exactly as it always did. It just gains
;  the passive effect of the torch you pick, and a stronger light.
; ============================================================

[lantern]
; Which torch's passive effect the lantern should carry. 0 = none.
;
;   24000000  Torch                  - the plain torch's fire aura
;   24020000  Steel-Wire Torch       - fire aura (its bleed is on attacks)
;   24040000  St. Trina's Torch      - fire aura (its sleep is on attacks)
;   24050000  Ghostflame Torch       - fire aura (its frost is on attacks)
;   24060000  Beast-Repellent Torch  - drives beasts away while held
;   24070000  Sentry's Torch         - reveals invisible enemies while held
;   24500000  Nanaya's Torch         - fire aura
;   16080000  Torchpole              - has no passive effect at all
;
; A torch trait that only fires when you SWING it can't come along - the
; lantern never attacks - so those torches give you the plain fire aura
; they all share. Only Beast-Repellent and Sentry's have a second, own
; effect on top of it.
torch = 24060000


[light]
; How far the lantern lights up around you. Vanilla is 16.
; 0 = leave it alone.
radius = 24

; How strong that light is. Vanilla is 1.25.
; 0 = leave it alone.
intensity = 2.0


[debugging]
; 1 = change NOTHING, just write the lantern's and every torch's raw param
;     rows to logs\LanternTorch.log.
dump = 0

[general]
; Make every weapon accept greases and spell buffs. 1=on, 0=off.
all_weapons_buffable = 1

; Extra EquipParamGoods ids (NOT category numbers) to treat as buff consumables.
extra_goods =

[stacking]
; Lets you stack buffs that normally replace one another. 1 = on, 0 = off.
stacking_bonuses = 0

[dual_wield]
; Apply weapon buffs (greases + weapon-skill enchants) to BOTH hands when dual-wielding. 1 = on, 0 = off.
mirror_to_offhand = 1
; Optional extra right:left SpEffect id pairs (in case you find something that doesn't work, it can be added manually here)
; Example: extra_pairs = 1755:1758, 1821:1823
extra_pairs =

; a list of all ids can be found here: https://github.com/soulsmods/Paramdex/blob/ff7245e524329bc3eab00036723d2bd53384cedf/ER/Names/SpEffectParam.txt

; ------------------------------------------------------------
;  Buff categories. Each: enabled (1=on, 0=off.) + duration (seconds, or "infinite").
; ------------------------------------------------------------

[greases]
enabled  = 1
duration = 600

[spell_buffs]
enabled  = 1
duration = infinite
; Covers spells that buff you and allies. Offensive spells and debuffs are left alone.

[consumables]
enabled  = 1
duration = infinite
extra_speffect_ids =

[ashes_of_war]
enabled  = 1
duration = 600
speffect_ids =
; The built-in list already covers every buff-granting Ash of War (Roar, Endure,
; Determination, Royal Knight's Resolve, Golden Vow, War Cry, Braggart's Roar,
; Oath of Vengeance, Vow-style poise buffs, Sacred/Shared Order, Last Rites,
; the element weapon-enchant arts like Cragblade/Flaming Strike/Sacred Blade, ...).
; Only add ids here if you use a mod that changes/adds ashes. Full id list:
; https://github.com/soulsmods/Paramdex/blob/ff7245e524329bc3eab00036723d2bd53384cedf/ER/Names/SpEffectParam.txt
; look for rows named "[Weapon] <Ash name> - ... Buff".
; example: speffect_ids = 1821, 1823, 1826, 1828   ; = the AoW "Cragblade"

; ------------------------------------------------------------
[logging]
log_affected = 1
dump = 0
debug_console = 0
